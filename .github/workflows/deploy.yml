name: Sync to Hugging Face Hub

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Push Backend to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          SUBTREE_SHA=$(git subtree split --prefix Backend main)
          git push "https://Noor2623:${HF_TOKEN}@huggingface.co/spaces/Noor2623/Smart-Query-Routing-Email-Automation-System.git" "$SUBTREE_SHA:main" --force